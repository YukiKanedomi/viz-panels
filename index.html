<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz-panels — 可視化の工作机</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --coral:#ee6a4c;
  --coral-deep:#d95535;
  --ink:#2b2620;
  --sub:#8a7f70;
  --paper:#faf6f0;
  --card:#ffffff;
}
body{
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:14px;line-height:1.75;
  background:var(--paper);
  min-height:100vh;
}
.klee{font-family:"Klee One","Zen Kaku Gothic New",sans-serif}

/* ---- hero ---- */
.hero{
  position:relative;color:#fff;
  background:#241a12 url('assets/hero.jpg') center 38%/cover no-repeat;
  padding:30px 20px 30px;
  min-height:420px;
  display:flex;flex-direction:column;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,12,6,.46) 0%,rgba(20,12,6,.10) 34%,rgba(30,18,8,.28) 62%,rgba(250,246,240,.96) 96%,var(--paper) 100%);
}
.hero>*{position:relative}
.hero h1{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.1;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.hero .sub{font-size:13.5px;opacity:.92;margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.bar{display:flex;gap:10px;margin-top:16px}
.search{
  flex:1;padding:11px 15px;border:none;border-radius:12px;
  background:rgba(255,255,255,.94);font-size:14px;color:var(--ink);
  font-family:inherit;box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.search::placeholder{color:#a99e8e}
.search:focus{outline:2px solid var(--coral);outline-offset:1px}
.count{
  align-self:center;white-space:nowrap;background:var(--coral);color:#fff;
  font-size:13px;font-weight:700;padding:9px 14px;border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.copy{
  margin-top:auto;padding-top:64px;
  font-family:"Klee One",sans-serif;font-weight:600;
  font-size:30px;line-height:1.5;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.55);
}

/* ---- tabs ---- */
.wrap{max-width:640px;margin:0 auto;padding:6px 16px 64px}
.tabs{display:flex;gap:26px;margin:10px 2px 18px}
.tab{
  font-size:14.5px;font-weight:700;color:var(--sub);
  background:none;border:none;font-family:inherit;cursor:pointer;
  padding:4px 2px 7px;position:relative;
}
.tab.on{color:var(--coral-deep)}
.tab.on::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--coral);border-radius:2px;
}

/* ---- cards ---- */
.grp{margin:22px 0 6px}
.label{
  font-family:"Klee One",sans-serif;font-size:14px;font-weight:600;color:#6e6250;
  margin:0 2px 12px;display:flex;align-items:baseline;gap:8px;
}
.label .n{font-size:11.5px;color:#b0a591}
.card{
  display:flex;text-decoration:none;color:inherit;
  background:var(--card);border-radius:16px;overflow:hidden;
  box-shadow:0 3px 14px rgba(90,60,30,.10);
  margin-bottom:14px;
  transition:transform .12s, box-shadow .12s;
}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.thumb{
  width:96px;min-height:96px;flex:none;background:center/cover no-repeat;
}
.thumb.mono{
  display:flex;align-items:center;justify-content:center;
  font-family:"Klee One",sans-serif;font-size:34px;font-weight:600;color:#fff;
}
.body{padding:12px 14px 10px;flex:1;min-width:0}
.row{display:flex;align-items:baseline;gap:8px}
.ttl{font-size:14.5px;font-weight:700;line-height:1.45}
.desc{
  font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{display:flex;align-items:center;margin-top:8px;gap:8px}
.tag{font-size:10px;color:var(--sub);background:#f2ece2;padding:2px 8px;border-radius:999px}
.date{font-size:10px;color:#b0a591}
.open{
  margin-left:auto;background:var(--coral);color:#fff;
  font-size:11.5px;font-weight:700;padding:5px 14px;border-radius:999px;
}
.empty{
  background:var(--card);border-radius:16px;padding:26px;text-align:center;
  color:var(--sub);font-family:"Klee One",sans-serif;
  box-shadow:0 3px 14px rgba(90,60,30,.08);margin-top:20px;
}
footer{
  margin-top:40px;text-align:center;font-family:"Klee One",sans-serif;
  font-size:11px;color:#9a8f7d;line-height:1.9;
}
footer code{font-family:inherit;background:#f2ece2;padding:0 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<div class="hero">
  <div>
    <h1>viz-panels</h1>
    <div class="sub klee">かねどみ家の 可視化 工作机</div>
  </div>
  <div class="bar">
    <input class="search" id="q" placeholder="さがす — タイトル・説明・プロジェクト">
    <div class="count" id="count"></div>
  </div>
  <div class="copy">今日も、<br>なにか作ってる。</div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tabProj">プロジェクト別</button>
    <button class="tab" id="tabNew">新着順</button>
  </div>
  <div id="list"></div>
  <footer>
    つくったHTMLを <code>&lt;project&gt;/</code> に置いて manifest に追記 → push で公開<br>
    YukiKanedomi / viz-panels
  </footer>
</div>

<script>
const TYPE={panel:"設定パネル",chart:"グラフ",report:"レポート",dashboard:"ダッシュボード"};
const THUMBS={
  "Yorozuya/karesansui.html":"assets/thumbs/karesansui.jpg",
  "engine-zukan/engine-zukan-01.html":"assets/thumbs/engine.jpg",
  "paper-radar/home.html":"assets/thumbs/radar.jpg"
};
const MONO=["#e8a05c","#7fa8a0","#c98a8a","#8a96c9","#a3b06a","#b98ac9"];
let ITEMS=[],mode="proj",query="";
fetch('manifest.json?_='+Date.now()).then(r=>r.json()).then(d=>{
  ITEMS=d.items||[];
  document.getElementById('count').textContent=ITEMS.length+'枚';
  render();
}).catch(()=>{
  document.getElementById('list').innerHTML='<div class="empty">manifest.json を読めませんでした</div>';
});
document.getElementById('q').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
document.getElementById('tabProj').onclick=()=>setMode("proj");
document.getElementById('tabNew').onclick=()=>setMode("new");
function setMode(m){
  mode=m;
  document.getElementById('tabProj').classList.toggle('on',m==="proj");
  document.getElementById('tabNew').classList.toggle('on',m==="new");
  render();
}
function card(it,ci){
  const t=it.type||'panel';
  const th=THUMBS[it.file];
  const thumb=th
    ?'<div class="thumb" style="background-image:url(\''+th+'\')"></div>'
    :'<div class="thumb mono" style="background:'+MONO[ci%MONO.length]+'">'+esc((it.title||'?').charAt(0))+'</div>';
  return '<a class="card" href="'+it.file+'">'
    +thumb
    +'<div class="body">'
    +'<div class="row"><span class="ttl">'+esc(it.title)+'</span></div>'
    +(it.desc?'<div class="desc">'+esc(it.desc)+'</div>':'')
    +'<div class="meta"><span class="tag">'+(TYPE[t]||esc(t))+'</span><span class="date">'+esc(it.added||'')+'</span><span class="open">ひらく</span></div>'
    +'</div></a>';
}
function render(){
  const f=ITEMS.filter(it=>!query||[it.title,it.desc,it.project].join(' ').toLowerCase().includes(query));
  const el=document.getElementById('list');
  if(!f.length){el.innerHTML='<div class="empty">みつかりませんでした</div>';return}
  if(mode==="new"){
    const s=[...f].sort((a,b)=>(b.added||'').localeCompare(a.added||''));
    el.innerHTML=s.map((it,i)=>card(it,i)).join('');
    return;
  }
  const byProj={};
  f.forEach(it=>{(byProj[it.project]=byProj[it.project]||[]).push(it)});
  const projs=Object.keys(byProj).sort();
  let ci=0;
  el.innerHTML=projs.map(p=>{
    const cards=byProj[p].map(it=>card(it,ci++)).join('');
    return '<div class="grp"><div class="label">'+esc(p)+'<span class="n">（'+byProj[p].length+'）</span></div>'+cards+'</div>';
  }).join('');
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
</body>
</html>
