<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帰宅ナビ 新杉田→橋本</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#e3e9f2; --line2:#cbd6e4;
    --tx:#16233c; --tx2:#5c6b84; --tx3:#93a1b7; --acc:#0f8a4d; --accbg:#e6f5ec;
    --jr-neg:#00a0d6; --jr-yok:#7cb518;
    --c-isogo:#0284c7; --c-saku:#7c3aed; --c-hk:#059669; --c-thru:#ea580c; --c-negishi:#c3cedd;
    --now:#ef7c1b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
    max-width:560px;margin:0 auto;padding-bottom:76px;min-height:100vh}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.01em}

  /* ---- sticky header ---- */
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px 10px;
    box-shadow:0 1px 8px rgba(22,35,60,.05)}
  .route{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .route .stpill{font-size:15px;font-weight:800;letter-spacing:.02em}
  .route .arw{color:var(--tx3);font-size:11px}
  .route .tag{margin-left:auto;font-size:10px;color:var(--tx2);background:var(--bg);
    padding:3px 9px;border-radius:99px;letter-spacing:.05em}
  .ctrl{display:flex;gap:8px;align-items:stretch}
  .ctrl input[type=time]{flex:1;background:#fff;border:1.5px solid var(--line2);color:var(--tx);
    font-size:22px;font-weight:700;padding:5px 12px;border-radius:12px;text-align:center;
    font-variant-numeric:tabular-nums;min-width:0;color-scheme:light}
  .btn{background:#fff;border:1.5px solid var(--line2);color:var(--tx);padding:0 13px;
    border-radius:12px;font-size:15px;cursor:pointer;display:flex;align-items:center;font-weight:600}
  .btn:active{background:var(--bg)}
  .btn.acc{color:#fff;background:var(--acc);border-color:var(--acc);font-weight:700}
  /* mini diagram strip */
  #mini{margin:10px -4px 0;border:1px solid var(--line);border-radius:10px;background:#fdfefe;overflow:hidden}
  .minihead{display:flex;justify-content:space-between;font-size:9.5px;color:var(--tx3);padding:4px 8px 0;letter-spacing:.06em}
  .minihead b{color:var(--tx2);font-weight:600}

  main{padding:14px 14px 0}
  h2{font-size:11px;color:var(--tx3);margin:8px 2px 10px;letter-spacing:.18em;font-weight:700}

  /* ---- itinerary card ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px 10px;margin-bottom:12px;cursor:pointer;
    box-shadow:0 2px 10px rgba(22,35,60,.06)}
  .card.sel{border-color:var(--acc);box-shadow:0 3px 14px rgba(15,138,77,.14)}
  .chead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b0{background:var(--accbg);color:var(--acc)}
  .b1{background:#eef7dc;color:#5d8f0a}
  .b2{background:#fdf3d7;color:#a87b0c}
  .b3{background:#fde8e8;color:#c04343}
  .strat{font-size:12px;color:var(--tx2);font-weight:600}
  .count{margin-left:auto;font-size:12px;color:var(--now);font-weight:800;white-space:nowrap}
  .count small{font-weight:500;color:var(--tx3)}

  /* vertical timeline */
  .tl{display:grid;grid-template-columns:46px 14px 1fr}
  .tm{font-size:14px;font-weight:700;text-align:right;padding-right:8px;line-height:20px}
  .nd{position:relative}
  .nd i{position:absolute;left:50%;top:10px;transform:translate(-50%,-50%);width:9px;height:9px;
    border-radius:50%;background:#fff;border:2.5px solid var(--tx3)}
  .nd.start i{border-color:var(--acc);width:11px;height:11px}
  .nd.goal i{background:var(--tx);border-color:var(--tx)}
  .lbl{font-size:13.5px;line-height:20px;padding-left:6px}
  .lbl small{color:var(--tx2);font-size:11px;margin-left:6px}
  .lbl .chip{display:inline-block;font-size:9.5px;font-weight:700;padding:1.5px 7px;border-radius:4px;
    margin-left:6px;vertical-align:1px;color:#fff}
  .seg{grid-column:2;position:relative;min-height:26px}
  .seg i{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);width:3.5px;border-radius:2px;background:var(--segc,#ccc)}
  .seg.walk i{background:repeating-linear-gradient(180deg,var(--tx3) 0 3px,transparent 3px 7px);width:2.5px}
  .segtxt{grid-column:3;font-size:11px;color:var(--tx2);padding-left:6px;display:flex;align-items:center;min-height:26px}
  .segtxt b{color:var(--tx);font-weight:700}
  .meta{display:flex;gap:14px;font-size:11px;color:var(--tx3);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  .meta b{color:var(--tx2);font-weight:700}

  /* ---- full diagram view ---- */
  #diaWrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:4px;
    padding:10px 6px 4px;box-shadow:0 2px 10px rgba(22,35,60,.06)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:10.5px;color:var(--tx2);padding:8px 10px 10px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:16px;height:3.5px;border-radius:2px}
  details{margin:16px 2px 0;font-size:11px;color:var(--tx2)}
  details summary{cursor:pointer;color:var(--tx3);font-size:11px;letter-spacing:.05em}
  details p{margin:8px 0 0;line-height:1.8}
  .empty{background:var(--panel);border:1px dashed var(--line2);border-radius:16px;padding:22px;
    text-align:center;color:var(--tx2);font-size:13px;line-height:1.8}

  /* ---- bottom tab bar ---- */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.95);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;padding:9px 0 10px;cursor:pointer;
    font-size:11px;color:var(--tx3);font-weight:700;letter-spacing:.08em}
  nav button .ic{display:block;font-size:17px;margin-bottom:2px}
  nav button.on{color:var(--acc)}
  nav button.on .ic{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="route">
    <span class="stpill">新杉田</span><span class="arw">▶</span><span class="stpill">橋本</span>
    <span class="tag">平日夜・着席重視</span>
  </div>
  <div class="ctrl">
    <button class="btn num" id="m5">−5</button>
    <input type="time" id="t" value="18:15">
    <button class="btn num" id="p5">＋5</button>
    <button class="btn acc" id="now">いま</button>
  </div>
  <div id="mini">
    <div class="minihead"><b>直近40分のスジ</b><span>タップでフルダイヤ</span></div>
    <div id="miniDia"></div>
  </div>
</header>
<main>
  <section id="viewCards">
    <h2>候補 — 着席しやすさ順</h2>
    <div id="cards"></div>
  </section>
  <section id="viewDia" style="display:none">
    <h2>ダイヤグラム — 指定時刻から約100分</h2>
    <div id="diaWrap">
      <div id="dia"></div>
      <div class="legend">
        <span><i style="background:var(--c-isogo)"></i>磯子始発</span>
        <span><i style="background:var(--c-saku)"></i>桜木町始発</span>
        <span><i style="background:var(--c-hk)"></i>東神奈川始発</span>
        <span><i style="background:var(--c-thru)"></i>大船方面直通</span>
        <span><i style="background:var(--c-negishi)"></i>根岸線</span>
      </div>
    </div>
  </section>
  <details>
    <summary>データと前提について</summary>
    <p>データ: JR東日本公式時刻表 2026年9月版・平日（2026-09-01取得）。所要の目安: 新杉田→磯子3分/桜木町16分/東神奈川23分、東神奈川→橋本47分。八王子行きも橋本に停車します。●印はその駅の始発（＝並べば座れる）。ダイヤ改正（例年3月）後は要更新。遅延・運休は反映しません。</p>
  </details>
</main>
<nav>
  <button id="tabC" class="on"><span class="ic">🚃</span>候補</button>
  <button id="tabD"><span class="ic">📈</span>ダイヤ</button>
</nav>
<script>
// ---- data (JR東日本公式 2026-09版 平日) ----
var NB = ["17:01","17:08","17:20","17:29","17:41","17:47","17:58","18:06","18:14","18:23","18:34","18:40","18:49","18:59","19:06","19:14","19:18","19:25","19:34","19:40","19:48","19:56","20:00","20:08","20:20","20:29","20:37","20:50","21:01","21:05","21:16","21:20","21:29","21:42","21:48","21:55","22:05","22:15","22:25","22:35","22:48","23:00"];
// 横浜線列車: [東神奈川発, 行き先, 出自, 始発駅発時刻]  出自: isogo/saku/hk/thru/unk
var YL = [
 ["17:04","八王子","unk",null],["17:12","八王子","hk",null],["17:20","八王子","isogo","17:01"],
 ["17:26","橋本","hk",null],["17:33","八王子","saku","17:25"],["17:41","橋本","hk",null],
 ["17:48","八王子","isogo","17:28"],["17:55","八王子","saku","17:47"],["18:01","橋本","hk",null],
 ["18:08","八王子","saku","18:01"],["18:13","橋本","hk",null],["18:19","八王子","hk",null],
 ["18:25","橋本","hk",null],["18:31","八王子","hk",null],["18:38","八王子","hk",null],
 ["18:44","八王子","hk",null],["18:49","橋本","isogo","18:30"],["18:55","八王子","hk",null],
 ["19:01","八王子","hk",null],["19:07","橋本","hk",null],["19:14","八王子","hk",null],
 ["19:20","橋本","hk",null],["19:25","八王子","hk",null],["19:32","橋本","isogo","19:13"],
 ["19:39","八王子","hk",null],["19:46","橋本","hk",null],["19:52","八王子","isogo","19:33"],
 ["20:00","八王子","hk",null],["20:08","橋本","hk",null],["20:14","八王子","isogo","19:55"],
 ["20:24","橋本","saku","20:17"],["20:30","八王子","hk",null],["20:38","八王子","saku","20:31"],
 ["20:47","八王子","hk",null],["20:56","八王子","saku","20:49"],["21:04","橋本","hk",null],
 ["21:12","八王子","hk",null],["21:19","橋本","hk",null],["21:28","八王子","thru","21:05"],
 ["21:38","橋本","hk",null],["21:44","八王子","saku","21:37"],["21:52","橋本","hk",null],
 ["22:01","八王子","hk",null],["22:10","八王子","thru","21:48"],["22:20","橋本","hk",null],
 ["22:26","八王子","saku","22:18"],["22:37","八王子","hk",null],["22:57","八王子","hk",null],
 ["23:09","八王子","hk",null],["23:18","八王子","hk",null],["23:32","八王子","saku","23:22"],
 ["23:48","橋本","hk",null]
];
var OFF={isogo:3,saku:16,yokohama:19,hk:23};       // 新杉田からの根岸線所要(分)
var HASHIMOTO=47;                                   // 東神奈川→橋本
var YSTOPS={"新横浜":9,"長津田":24,"町田":31,"橋本":47}; // 東神奈川からの累積
function mm(s){var p=s.split(":");return (+p[0])*60+(+p[1]);}
function hh(m){var h=Math.floor(m/60)%24,x=m%60;return (h<10?"0":"")+h+":"+(x<10?"0":"")+x;}

// ---- itinerary engine ----
function latestNB(T,limit){ // T以降に新杉田を出て limit までに着ける最も遅い北行
  var best=null;
  for(var i=0;i<NB.length;i++){var d=mm(NB[i]);
    if(d>=T&&d<=limit&&(best===null||d>best))best=d;}
  return best;
}
function plan(T){
  var out=[];
  for(var i=0;i<YL.length;i++){
    var hk=mm(YL[i][0]),dest=YL[i][1],origin=YL[i][2],od=YL[i][3];
    if(dest==="町田")continue;
    if(hk>T+95)continue;
    var arr=hk+HASHIMOTO,o=null;
    if(origin==="isogo"||origin==="saku"){
      var ofs=origin==="isogo"?OFF.isogo:OFF.saku,odM=mm(od);
      // 並び3分を確保できる便を優先。無理ならギリギリ便(○)
      var acc=latestNB(T,odM-3-ofs),tight=false;
      if(acc===null){acc=latestNB(T,odM-1-ofs);tight=true;}
      if(acc===null)continue;
      var wait=odM-(acc+ofs);
      o={origin:origin,dest:dest,hkM:hk,arr:arr,od:odM,acc:acc,wait:wait,
         seat:tight?1:0,boardAt:origin==="isogo"?"磯子":"桜木町"};
    }else if(origin==="hk"){
      // 並び6分を確保できる便を優先。無理なら2分乗換(△)
      var acc2=latestNB(T,hk-6-OFF.hk),tight2=false;
      if(acc2===null){acc2=latestNB(T,hk-2-OFF.hk);tight2=true;}
      if(acc2===null)continue;
      var w2=hk-(acc2+OFF.hk);
      o={origin:origin,dest:dest,hkM:hk,arr:arr,od:hk,acc:acc2,wait:w2,
         seat:tight2?2:0,boardAt:"東神奈川"};
    }else if(origin==="thru"){
      var dep=hk-OFF.hk;
      if(dep<T)continue;
      o={origin:origin,dest:dest,hkM:hk,arr:arr,od:dep,acc:dep,wait:0,seat:3,boardAt:"新杉田"};
    }
    if(o)out.push(o);
  }
  // 同じ横浜線列車×作戦は最遅出発だけ残し、着席優先→到着順で上位7件
  var best={},k;
  for(var j=0;j<out.length;j++){k=out[j].hkM+"_"+out[j].origin;
    if(!best[k]||out[j].acc>best[k].acc)best[k]=out[j];}
  var arr2=Object.keys(best).map(function(x){return best[x];});
  arr2.sort(function(a,b){return a.seat-b.seat||a.arr-b.arr;});
  return arr2.slice(0,7);
}
// ---- UI ----
var SN={isogo:"磯子始発ねらい",saku:"桜木町始発ねらい",hk:"東神奈川で並び直し",thru:"新杉田から直通",unk:"直通"};
var SEAT=["◎ 着席ほぼ確実","○ 始発・並び短め","△ 当駅始発・列次第","× 着席困難"];
var COL={isogo:"#0284c7",saku:"#7c3aed",hk:"#059669",thru:"#ea580c",unk:"#ea580c"};
var NEG='<span class="chip" style="background:var(--jr-neg)">根岸線</span>';
var YOK='<span class="chip" style="background:var(--jr-yok)">横浜線</span>';
var sel=-1,cur=[];
function cardHTML(o,i,T){
  var h='<div class="chead"><span class="badge b'+o.seat+'">'+SEAT[o.seat]+'</span>'
    +'<span class="strat">'+SN[o.origin]+'</span>';
  var lead=o.acc-T;
  h+='<span class="count num">'+(lead<=0?'まもなく発車':'あと'+lead+'分')+'<small>で出発</small></span></div>';
  h+='<div class="tl">';
  function row(time,cls,label){h+='<span class="tm num">'+time+'</span>'
    +'<span class="nd '+cls+'"><i></i></span><div class="lbl">'+label+'</div>';}
  function seg(color,walk,txt){h+='<div class="seg'+(walk?' walk':'')+'" style="--segc:'+color+'"><i></i></div>'
    +'<div class="segtxt">'+txt+'</div>';}
  if(o.origin==="thru"){
    row(hh(o.od),'start','新杉田 <b>発</b>'+YOK+'<small>'+o.dest+'行き・大船方面から直通</small>');
    seg('var(--jr-yok)',false,'乗換なし '+(o.arr-o.od)+'分 <b>ただし着席は困難</b>');
    row(hh(o.arr),'goal','橋本 <b>着</b>');
  }else{
    var ofs=o.origin==="isogo"?OFF.isogo:o.origin==="saku"?OFF.saku:OFF.hk;
    row(hh(o.acc),'start','新杉田 <b>発</b>'+NEG+'<small>横浜方面 各駅停車</small>');
    seg('var(--jr-neg)',false,(o.origin==="isogo"?'1駅 ':'')+ofs+'分');
    row(hh(o.acc+ofs),'',o.boardAt+' <b>着</b>');
    seg('transparent',true,'ホームで<b>待ち'+o.wait+'分</b> — 列に並んで席を確保');
    row(hh(o.od),'start',o.boardAt+' <b>発</b>'+YOK+'<small>'+o.dest+'行き'+(o.origin==="hk"?'（当駅始発●）':'（始発●）')+'</small>');
    seg('var(--jr-yok)',false,(o.arr-o.od)+'分・座って寝てOK');
    row(hh(o.arr),'goal','橋本 <b>着</b>');
  }
  h+='</div>';
  h+='<div class="meta"><span>所要 <b class="num">'+(o.arr-T)+'分</b></span><span>乗換 <b>'+(o.origin==="thru"?"0回":"1回")+'</b></span>'
    +'<span>橋本 <b class="num">'+hh(o.arr)+'</b> 着</span></div>';
  return h;
}
function render(){
  var T=mm(document.getElementById("t").value);cur=plan(T);
  var el=document.getElementById("cards");el.innerHTML="";
  if(!cur.length)el.innerHTML='<div class="empty">この時間帯の候補が見つかりません。<br>データ範囲は 17:00〜23:59 です。</div>';
  cur.forEach(function(o,i){
    var d=document.createElement("div");d.className="card"+(i===sel?" sel":"");
    d.innerHTML=cardHTML(o,i,T);
    d.onclick=function(){sel=(sel===i?-1:i);render();};
    el.appendChild(d);
  });
  miniDia(T);diagram(T);
}
// 列車のスジ座標（分,駅位置）列を作る共通関数
function trainPath(idx){
  var hk=mm(YL[idx][0]),origin=YL[idx][2],od=YL[idx][3],pts=[];
  if(origin==="isogo")pts=[[mm(od),3],[mm(od)+13,16],[mm(od)+16,19],[hk,23]];
  else if(origin==="saku")pts=[[mm(od),16],[mm(od)+3,19],[hk,23]];
  else if(origin==="thru")pts=[[mm(od),0],[mm(od)+3,3],[mm(od)+16,16],[mm(od)+19,19],[hk,23]];
  else pts=[[hk,23]];
  var st;for(st in YSTOPS)pts.push([hk+YSTOPS[st],23+YSTOPS[st]]);
  return pts;
}
function miniDia(T){
  var w=612,h=118,L=54,R=6,TOP=6,B=16,t0=T-2,t1=T+40;
  function X(t){return L+(w-L-R)*(t-t0)/(t1-t0);}
  function Y(m){return TOP+(h-TOP-B)*m/70;}
  var s='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block">',i,t;
  var rows=[["新杉田",0],["東神奈川",23],["橋本",70]];
  for(i=0;i<rows.length;i++){var y=Y(rows[i][1]);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(w-R)+'" y2="'+y+'" stroke="#e3e9f2" stroke-width="0.8"/>';
    s+='<text x="'+(L-5)+'" y="'+(y+(rows[i][1]===0?8:rows[i][1]===70?-2:4))+'" fill="#5c6b84" font-size="10.5" text-anchor="end" font-weight="600">'+rows[i][0]+'</text>';}
  for(t=Math.ceil(t0/10)*10;t<=t1;t+=10){
    s+='<line x1="'+X(t)+'" y1="'+TOP+'" x2="'+X(t)+'" y2="'+(h-B)+'" stroke="#edf1f7" stroke-width="0.8"/>';
    s+='<text x="'+X(t)+'" y="'+(h-4)+'" fill="#93a1b7" font-size="9.5" text-anchor="middle" font-weight="600">'+hh(t)+'</text>';}
  s+='<line x1="'+X(T)+'" y1="'+TOP+'" x2="'+X(T)+'" y2="'+(h-B)+'" stroke="#ef7c1b" stroke-width="1.2" stroke-dasharray="3 3"/>';
  for(i=0;i<NB.length;i++){var d=mm(NB[i]);if(d<t0-25||d>t1)continue;
    s+='<polyline points="'+X(d)+','+Y(0)+' '+X(d+3)+','+Y(3)+' '+X(d+16)+','+Y(16)+' '+X(d+19)+','+Y(19)+' '+X(d+23)+','+Y(23)+'" fill="none" stroke="#c3cedd" stroke-width="1" stroke-linejoin="round"/>';}
  for(i=0;i<YL.length;i++){
    if(YL[i][1]==="町田")continue;var hk=mm(YL[i][0]);
    if(hk<t0-47||hk-23>t1)continue;
    var col=COL[YL[i][2]],pts=trainPath(i);
    var isSel=sel>=0&&cur[sel]&&cur[sel].hkM===hk&&COL[cur[sel].origin]===col;
    var ps="";for(var q=0;q<pts.length;q++)ps+=X(pts[q][0])+","+Y(pts[q][1])+" ";
    s+='<polyline points="'+ps+'" fill="none" stroke="'+col+'" stroke-width="'+(isSel?2.8:1.3)+'" opacity="'+(sel>=0&&!isSel?0.22:0.85)+'" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  s+="</svg>";
  document.getElementById("miniDia").innerHTML=s;
}
function diagram(T){
  var w=612,h=560,L=76,R=10,TOP=20,B=28,t0=T-4,t1=T+96;
  function X(t){return L+(w-L-R)*(t-t0)/(t1-t0);}
  function Y(m){return TOP+(h-TOP-B)*m/70;}
  var rows=[["新杉田",0],["磯子",3],["桜木町",16],["横浜",19],["東神奈川",23],["新横浜",32],["長津田",47],["町田",54],["橋本",70]];
  var s='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block">',i,t;
  s+='<rect x="'+L+'" y="'+Y(0)+'" width="'+(w-L-R)+'" height="'+(Y(23)-Y(0))+'" fill="#00a0d6" opacity="0.05"/>';
  s+='<rect x="'+L+'" y="'+Y(23)+'" width="'+(w-L-R)+'" height="'+(Y(70)-Y(23))+'" fill="#7cb518" opacity="0.05"/>';
  for(t=Math.ceil(t0/10)*10;t<=t1;t+=10){
    s+='<line x1="'+X(t)+'" y1="'+TOP+'" x2="'+X(t)+'" y2="'+(h-B)+'" stroke="#e3e9f2" stroke-width="0.8"/>';
    s+='<text x="'+X(t)+'" y="'+(h-10)+'" fill="#5c6b84" font-size="12" text-anchor="middle" font-weight="600">'+hh(t)+'</text>';}
  for(i=0;i<rows.length;i++){var y=Y(rows[i][1]);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(w-R)+'" y2="'+y+'" stroke="#e3e9f2" stroke-width="0.8"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" fill="#16233c" font-size="13" text-anchor="end" font-weight="600">'+rows[i][0]+'</text>';}
  s+='<line x1="'+X(T)+'" y1="'+TOP+'" x2="'+X(T)+'" y2="'+(h-B)+'" stroke="#ef7c1b" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s+='<text x="'+(X(T)+4)+'" y="'+(TOP+11)+'" fill="#ef7c1b" font-size="11" font-weight="700">'+hh(T)+'</text>';
  for(i=0;i<NB.length;i++){var d=mm(NB[i]);if(d<t0-25||d>t1)continue;
    s+='<polyline points="'+X(d)+','+Y(0)+' '+X(d+3)+','+Y(3)+' '+X(d+16)+','+Y(16)+' '+X(d+19)+','+Y(19)+' '+X(d+23)+','+Y(23)+'" fill="none" stroke="#c3cedd" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>';}
  for(i=0;i<YL.length;i++){
    if(YL[i][1]==="町田")continue;
    var hk=mm(YL[i][0]),origin=YL[i][2];
    if(hk<t0-47||hk-23>t1)continue;
    var col=COL[origin],pts=trainPath(i);
    var isSel=sel>=0&&cur[sel]&&cur[sel].hkM===hk&&COL[cur[sel].origin]===col;
    var ps="";for(var q=0;q<pts.length;q++)ps+=X(pts[q][0])+","+Y(pts[q][1])+" ";
    s+='<polyline points="'+ps+'" fill="none" stroke="'+col+'" stroke-width="'+(isSel?3.4:1.7)+'" opacity="'+(sel>=0&&!isSel?0.22:0.9)+'" stroke-linejoin="round" stroke-linecap="round"/>';
    if(origin!=="unk"){var px=origin==="hk"?X(hk):X(pts[0][0]),py=origin==="hk"?Y(23):Y(pts[0][1]);
      s+='<circle cx="'+px+'" cy="'+py+'" r="3" fill="'+col+'"'+(sel>=0&&!isSel?' opacity="0.22"':'')+'/>';}
  }
  s+="</svg>";
  document.getElementById("dia").innerHTML=s;
}
function shift(d){var e=document.getElementById("t"),v=mm(e.value)+d;
  if(v<0)v=0;if(v>1439)v=1439;
  e.value=hh(v);sel=-1;render();}
function showTab(dia){
  document.getElementById("viewCards").style.display=dia?"none":"";
  document.getElementById("viewDia").style.display=dia?"":"none";
  document.getElementById("tabC").className=dia?"":"on";
  document.getElementById("tabD").className=dia?"on":"";
  window.scrollTo(0,0);
}
document.getElementById("t").addEventListener("change",function(){sel=-1;render();});
document.getElementById("m5").onclick=function(){shift(-5);};
document.getElementById("p5").onclick=function(){shift(5);};
document.getElementById("now").onclick=function(){
  var n=new Date(Date.now()+9*3600*1000);
  document.getElementById("t").value=(n.getUTCHours()<10?"0":"")+n.getUTCHours()+":"+(n.getUTCMinutes()<10?"0":"")+n.getUTCMinutes();
  sel=-1;render();};
document.getElementById("tabC").onclick=function(){showTab(false);};
document.getElementById("tabD").onclick=function(){showTab(true);};
document.getElementById("mini").onclick=function(){showTab(true);};
render();
</script>
