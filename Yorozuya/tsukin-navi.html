<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>帰宅ナビ 新杉田→橋本</title>
<meta name="theme-color" content="#0f8a4d">
<link rel="manifest" href="tsukin-navi.webmanifest">
<link rel="apple-touch-icon" href="tsukin-navi-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="帰宅ナビ">
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#e3e9f2; --line2:#cbd6e4;
    --tx:#16233c; --tx2:#526078; --tx3:#93a1b7; --acc:#0f8a4d; --accbg:#e6f5ec;
    --jr-neg:#00a0d6; --jr-yok:#7cb518;
    --now:#e05d00; --alert:#d92c2c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
  body{background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
    max-width:560px;margin:0 auto;padding-bottom:132px;min-height:100vh}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.01em}

  /* ---- slim sticky header ---- */
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:11px 16px;
    display:flex;align-items:center;gap:8px}
  .stpill{font-size:16px;font-weight:800}
  .arw{color:var(--tx3);font-size:11px}
  .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--tx2);background:var(--bg);
    padding:5px 11px;border-radius:99px}
  .tag.live{color:#fff;background:var(--acc)}
  .banner{background:#fdf3d7;color:#8a6407;font-size:12px;font-weight:600;padding:8px 16px;
    border-bottom:1px solid #f0e3b5}

  /* ---- collapsible full-night strip ---- */
  #miniBox{margin:10px 14px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  #miniToggle{width:100%;background:none;border:none;padding:11px 14px;font-size:12.5px;font-weight:700;
    color:var(--tx2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px}
  #miniToggle .cv{margin-left:auto;color:var(--tx3);transition:transform .15s}
  #miniBox.open #miniToggle .cv{transform:rotate(180deg)}
  #miniBody{display:none;position:relative;border-top:1px solid var(--line)}
  #miniBox.open #miniBody{display:block}
  .zrow{position:absolute;right:8px;top:6px;z-index:2;display:flex;gap:10px}
  .mz{width:44px;height:44px;border:1px solid var(--line2);background:rgba(255,255,255,.94);border-radius:12px;
    font-size:20px;cursor:pointer;color:var(--tx);line-height:1;font-weight:700}
  .miniscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
  .miniscroll::-webkit-scrollbar{display:none}
  .minilabels{position:absolute;left:0;top:0;pointer-events:none;width:100%;height:0}
  .minilabels span{position:absolute;left:4px;transform:translateY(-50%);font-size:10px;font-weight:700;
    color:var(--tx2);background:rgba(255,255,255,.9);padding:1px 6px;border-radius:4px;line-height:1.5}

  main{padding:12px 14px 0}
  h2{font-size:11px;color:var(--tx2);margin:8px 2px 10px;letter-spacing:.18em;font-weight:700}

  /* ---- itinerary card ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 10px;margin-bottom:12px;cursor:pointer;
    box-shadow:0 2px 10px rgba(22,35,60,.06)}
  .card.best{border:2px solid var(--acc);box-shadow:0 4px 16px rgba(15,138,77,.14)}
  .bestbar{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--acc);
    border-radius:6px;padding:2px 8px;letter-spacing:.12em;margin-bottom:8px}
  .hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .hero .dep{font-size:30px;font-weight:800;line-height:1}
  .hero .u{font-size:12px;color:var(--tx2);font-weight:700}
  .hero .ar{color:var(--tx3);font-size:15px}
  .hero .arr{font-size:21px;font-weight:700}
  .cd{margin-left:auto;font-size:15px;font-weight:800;color:var(--now);white-space:nowrap}
  .cd.soon{color:var(--alert)}
  .cd small{font-weight:600;font-size:11px}
  .sub{font-size:13.5px;color:var(--tx);margin-top:9px;line-height:1.6}
  .sub b{font-weight:800}
  .badge{font-size:11.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;white-space:nowrap;margin-left:4px}
  .b0{background:var(--accbg);color:var(--acc)}
  .b1{background:#eef7dc;color:#5d8f0a}
  .b2{background:#fdf3d7;color:#a87b0c}
  .b3{background:#fde8e8;color:#c04343}
  .alt{font-size:12px;color:var(--tx2);margin-top:8px}
  .alt b{font-weight:700;color:var(--tx)}
  /* 最終便リミット */
  #limits{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:6px 14px;box-shadow:0 2px 10px rgba(22,35,60,.06);margin-bottom:12px}
  .lim{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .lim:last-child{border-bottom:none}
  .lim .ldot{width:9px;height:9px;border-radius:50%;flex:none}
  .lim .lname{font-weight:700;min-width:96px}
  .lim .ltime{color:var(--tx2)}
  .lim .ltime b{color:var(--tx);font-weight:800}
  .lim .lleft{margin-left:auto;font-size:12px;font-weight:800;color:var(--tx2);white-space:nowrap}
  .lim.warn .lleft{color:var(--alert)}
  .lim.gone{opacity:.45}
  .lim.gone .lleft{color:var(--tx3)}
  .meta{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:9px;padding-top:9px;
    border-top:1px solid var(--line);align-items:center}
  .meta .cv{margin-left:auto;color:var(--tx3);font-size:11px}
  .card.open .meta .cv .chev{display:inline-block;transform:rotate(180deg)}

  /* vertical timeline (展開時のみ) */
  .tlwrap{display:none;margin-top:11px}
  .card.open .tlwrap{display:block}
  .tl{display:grid;grid-template-columns:46px 14px 1fr}
  .tm{font-size:14px;font-weight:700;text-align:right;padding-right:8px;line-height:20px}
  .nd{position:relative}
  .nd i{position:absolute;left:50%;top:10px;transform:translate(-50%,-50%);width:9px;height:9px;
    border-radius:50%;background:#fff;border:2.5px solid var(--tx3)}
  .nd.start i{border-color:var(--acc);width:11px;height:11px}
  .nd.goal i{background:var(--tx);border-color:var(--tx)}
  .lbl{font-size:13.5px;line-height:20px;padding-left:6px}
  .lbl small{color:var(--tx2);font-size:11.5px;margin-left:6px}
  .lbl .chip{display:inline-block;font-size:10px;font-weight:700;padding:1.5px 7px;border-radius:4px;
    margin-left:6px;vertical-align:1px;color:#fff}
  .seg{grid-column:2;position:relative;min-height:24px}
  .seg i{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);width:3.5px;border-radius:2px;background:var(--segc,#ccc)}
  .seg.walk i{background:repeating-linear-gradient(180deg,var(--tx3) 0 3px,transparent 3px 7px);width:2.5px}
  .segtxt{grid-column:3;font-size:12px;color:var(--tx2);padding-left:6px;display:flex;align-items:center;min-height:24px}
  .segtxt b{color:var(--tx);font-weight:700}

  /* ---- full diagram view ---- */
  #diaWrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:4px;
    padding:6px 6px 4px;box-shadow:0 2px 10px rgba(22,35,60,.06);position:relative}
  .diahead{display:flex;align-items:center;padding:6px 10px 4px;font-size:12px;color:var(--tx2);font-weight:700}
  .diahead .zrow2{margin-left:auto;display:flex;gap:10px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;color:var(--tx2);padding:8px 10px 10px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:16px;height:4px;border-radius:2px}
  details{margin:16px 2px 0;font-size:11.5px;color:var(--tx2)}
  details summary{cursor:pointer;color:var(--tx3);font-size:11px;letter-spacing:.05em}
  details p{margin:8px 0 0;line-height:1.8}
  .empty{background:var(--panel);border:1px dashed var(--line2);border-radius:16px;padding:22px;
    text-align:center;color:var(--tx2);font-size:13px;line-height:1.8}

  /* ---- train detail bottom sheet ---- */
  #trainDetail{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)}
  .tdcard{background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
    box-shadow:0 -8px 28px rgba(22,35,60,.18);padding:14px 16px 18px}
  .tdhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .tdhead .dot{width:11px;height:11px;border-radius:50%}
  .tdhead b{font-size:14.5px}
  .tdx{margin-left:auto;border:1px solid var(--line2);background:#fff;border-radius:12px;
    width:44px;height:44px;font-size:18px;cursor:pointer;color:var(--tx2);line-height:1}
  .tdstops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tdstops .stp{display:flex;flex-direction:column;align-items:center;background:#f8fafc;
    border:1px solid var(--line);border-radius:8px;padding:4px 2px}
  .tdstops .stp small{font-size:10px;color:var(--tx2)}
  .tdstops .stp b{font-size:13px}
  .tdstops .stp.org{border-color:var(--acc);background:var(--accbg)}
  .tdnote{font-size:12.5px;color:var(--tx2);margin-top:10px;line-height:1.7}
  .tdnote b{color:var(--acc)}

  /* ---- bottom controls + tab bar ---- */
  #bottomCtrl{position:fixed;left:0;right:0;bottom:58px;z-index:20;max-width:560px;margin:0 auto;
    display:flex;gap:8px;padding:8px 12px;background:rgba(244,246,249,.94);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  #bottomCtrl input[type=time]{flex:1;background:#fff;border:1.5px solid var(--line2);color:var(--tx);
    font-size:21px;font-weight:700;padding:5px 10px;border-radius:12px;text-align:center;
    font-variant-numeric:tabular-nums;min-width:0;color-scheme:light;height:46px}
  .btn{background:#fff;border:1.5px solid var(--line2);color:var(--tx);min-width:48px;height:46px;
    border-radius:12px;font-size:15px;cursor:pointer;font-weight:700}
  .btn:active{background:var(--bg)}
  .btn.acc{color:#fff;background:var(--acc);border-color:var(--acc)}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.97);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    display:flex;max-width:560px;margin:0 auto;height:58px;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;cursor:pointer;
    font-size:11.5px;color:var(--tx3);font-weight:700;letter-spacing:.08em}
  nav button.on{color:var(--acc)}
  .tabic{display:block;width:25px;height:25px;margin:0 auto 3px;background:currentColor;
    -webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat}

      var dep=mm(od);  // 実測の新杉田発時刻（東神奈川発-23分の推定だと21:48発が21:47になる）
      if(dep<T)continue;
      o={origin:origin,dest:dest,hkM:hk,arr:arr,od:dep,acc:dep,wait:0,seat:0,boardAt:"新杉田"};
    }
    if(o)out.push(o);
  }
  // 同じ列車×作戦は最遅アクセスのみ残す
  var perTrain={},k;
  for(var j=0;j<out.length;j++){k=out[j].hkM+"_"+out[j].origin;
    if(!perTrain[k]||out[j].acc>perTrain[k].acc)perTrain[k]=out[j];}
  // 同じアクセス電車×作戦は最先着を主案に、次便は「乗り遅れ保険」として footer 化
  var groups={};
  Object.keys(perTrain).forEach(function(x){var o=perTrain[x],g=o.acc+"_"+o.origin;
    (groups[g]=groups[g]||[]).push(o);});
  var list=[];
  Object.keys(groups).forEach(function(g){
    var arr2=groups[g].sort(function(a,b){return a.arr-b.arr;});
    var p=arr2[0];
    if(arr2.length>1)p.next=arr2[1];
    list.push(p);
  });
  list.sort(function(a,b){return PRI[a.origin]-PRI[b.origin]||a.seat-b.seat||a.arr-b.arr;});
  var sliced=list.slice(0,5),hasThru=false,z;
  for(z=0;z<sliced.length;z++)if(sliced[z].origin==="thru")hasThru=true;
  if(!hasThru)for(z=0;z<list.length;z++)if(list[z].origin==="thru"){sliced.push(list[z]);break;}
  return sliced;
}

// 新杉田発depの根岸線から、各乗換先の「次の始発」への接続を計算
function connInfo(dep){
  var defs=[["isogo","磯子",OFF.isogo],["saku","桜木町",OFF.saku],["hk","東神奈川",OFF.hk]],lines=[];
  for(var d=0;d<defs.length;d++){
    var org=defs[d][0],nm=defs[d][1],ofs=defs[d][2],best=null;
    for(var i=0;i<YL.length;i++){
      if(YL[i][2]!==org||YL[i][1]==="町田")continue;
      var odM=org==="hk"?mm(YL[i][0]):mm(YL[i][3]);
      if(odM>=dep+ofs+1&&(best===null||odM<best.od))best={od:odM,arr:mm(YL[i][0])+HASHIMOTO};
    }
    if(best&&best.od-(dep+ofs)<=45)lines.push(nm+' <b class="num">'+hh(best.od)+'発</b>（待ち'+(best.od-(dep+ofs))+'分・橋本'+hh(best.arr)+'着）');
  }
  return lines;
}

  else if(origin==="saku")stops=[["桜木町",mm(od)],["横浜",mm(od)+3]];
  else if(origin==="thru")stops=[["新杉田",mm(od)],["磯子",mm(od)+3],["桜木町",mm(od)+16],["横浜",mm(od)+19]];
  stops.push(["東神奈川",hk]);
  var st;for(st in YSTOPS)stops.push([st,hk+YSTOPS[st]]);
  var h='<div class="tdcard"><div class="tdhead"><span class="dot" style="background:'+col+'"></span>'
    +'<b>'+ORIGIN_NAME[origin]+' '+dest+'行き</b>'
    +((origin==="isogo"||origin==="saku"||origin==="hk")?'<span class="badge b0">始発●</span>':'<span class="badge b0">直通◎</span>')
    +'<button class="tdx" id="tdClose">×</button></div><div class="tdstops">';
  for(var i=0;i<stops.length;i++)
    h+='<span class="stp'+(i===0?' org':'')+'"><small>'+stops[i][0]+'</small><b class="num">'+hh(stops[i][1])+'</b></span>';
  h+='</div>';
  var match=null;for(var j=0;j<cur.length;j++)if(cur[j].hkM===hk&&cur[j].origin===origin)match=cur[j];
  if(match)h+='<div class="tdnote">候補'+SEAT[match.seat].charAt(0)+' : 新杉田 <b class="num">'+hh(match.acc)+'</b> 発の根岸線に乗り、'
    +(match.origin==="thru"?'そのまま直通。':match.boardAt+'で<b>待ち'+match.wait+'分</b>並んで乗車。')
    +'橋本 <b class="num">'+hh(match.arr)+'</b> 着。</div>';
  else{
    // 候補外でも「新杉田を何時に出れば乗れるか」を示す
    if(origin==="thru")h+='<div class="tdnote">新杉田 <b class="num">'+hh(mm(od))+'</b> 発にそのまま乗車（経験上ほぼ座れる）。</div>';
    else{
      var ofs2=origin==="isogo"?OFF.isogo:origin==="saku"?OFF.saku:OFF.hk;
      var odM2=origin==="hk"?hk:mm(od);
      var req=latestNB(0,odM2-1-ofs2);
      if(req!==null)h+='<div class="tdnote">乗るなら新杉田 <b class="num">'+hh(req)+'</b> 発の根岸線 → '
        +(origin==="hk"?"東神奈川":origin==="isogo"?"磯子":"桜木町")+'で待ち'+(odM2-(req+ofs2))+'分。橋本 <b class="num">'+hh(hk+HASHIMOTO)+'</b> 着。</div>';
      else h+='<div class="tdnote">接続できる根岸線がありません。</div>';
    }
  }
  h+='</div>';
  el.innerHTML=h;
}
function dzoom(dir){
  var idx=DZLEVELS.indexOf(DZ)+dir;
  if(idx<0||idx>=DZLEVELS.length)return;
  var sc=document.getElementById("diaScroll");
  var t=17*60+(sc.scrollLeft+sc.clientWidth/2-14)/DZ;
  DZ=DZLEVELS[idx];
  diagram(mm(document.getElementById("t").value),false);
  sc.scrollLeft=Math.max(0,14+(t-17*60)*DZ-sc.clientWidth/2);
}
function shift(d){var e=document.getElementById("t"),v=mm(e.value)+d;
  if(v<0)v=0;if(v>1439)v=1439;
  e.value=hh(v);nowMode=false;render();}
function setNow(){
  var n=new Date(Date.now()+9*3600*1000);
  document.getElementById("t").value=(n.getUTCHours()<10?"0":"")+n.getUTCHours()+":"+(n.getUTCMinutes()<10?"0":"")+n.getUTCMinutes();
}
function showTab(dia){
  document.getElementById("viewCards").style.display=dia?"none":"";
  document.getElementById("viewDia").style.display=dia?"":"none";
  document.getElementById("miniBox").style.display=dia?"none":"";
  document.getElementById("tabC").className=dia?"":"on";
  document.getElementById("tabD").className=dia?"on":"";
  if(!dia){dsel=-1;dselKind=null;trainDetail();}
  window.scrollTo(0,0);
  if(dia)diagram(mm(document.getElementById("t").value),false);
}
document.getElementById("t").addEventListener("change",function(){nowMode=false;render();});
document.getElementById("m5").onclick=function(){shift(-5);};
document.getElementById("p5").onclick=function(){shift(5);};
document.getElementById("now").onclick=function(){nowMode=true;setNow();render();};
setInterval(function(){if(nowMode){setNow();render();}},30000);
document.getElementById("tabC").onclick=function(){showTab(false);};
document.getElementById("tabD").onclick=function(){showTab(true);};
document.getElementById("mzIn").onclick=function(){mzoom(1);};
document.getElementById("mzOut").onclick=function(){mzoom(-1);};
document.getElementById("dzIn").onclick=function(){dzoom(1);};
document.getElementById("dzOut").onclick=function(){dzoom(-1);};
document.getElementById("miniToggle").onclick=function(){
  var mb=document.getElementById("miniBox");
  mb.classList.toggle("open");
  if(mb.classList.contains("open"))miniDia(mm(document.getElementById("t").value),false);
};
document.getElementById("dia").addEventListener("click",function(e){
  var el=e.target.closest?e.target.closest("[data-ti],[data-nb]"):null;
  if(!el)return;
  if(el.hasAttribute("data-nb")){dsel=+el.getAttribute("data-nb");dselKind="nb";}
  else{dsel=+el.getAttribute("data-ti");dselKind="yl";}
  diagram(mm(document.getElementById("t").value),true);
});
document.getElementById("trainDetail").addEventListener("click",function(e){
  if(e.target.id==="tdClose"){dsel=-1;dselKind=null;diagram(mm(document.getElementById("t").value),true);}
});
function attachPinch(id,zoomFn,dblFn){
  var sc=document.getElementById(id),d0=0;
  function dist(e){var a=e.touches[0],b=e.touches[1];
    return Math.sqrt(Math.pow(a.clientX-b.clientX,2)+Math.pow(a.clientY-b.clientY,2));}
  sc.addEventListener("touchstart",function(e){if(e.touches.length===2)d0=dist(e);},{passive:true});
  sc.addEventListener("touchmove",function(e){
    if(e.touches.length!==2||!d0)return;
    var d=dist(e);
    if(d>d0*1.35){zoomFn(1);d0=d;e.preventDefault();}
    else if(d<d0*0.74){zoomFn(-1);d0=d;e.preventDefault();}
  },{passive:false});
  sc.addEventListener("dblclick",dblFn);
}
attachPinch("miniScroll",mzoom,function(){mzoom(MZ<12?1:-1);});
attachPinch("diaScroll",dzoom,function(){dzoom(DZ<16?1:-1);});
