<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>風化灯 - ひとりでは灯らない</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #04060a;
    overflow: hidden;
    font-family: "MS Gothic", "Osaka-mono", monospace;
    color: #7fffb0;
  }
  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.25) 2px, rgba(0,0,0,0.25) 3px
    );
    mix-blend-mode: overlay;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #chan {
    position: absolute; top: 14px; left: 16px;
    font-size: 11px; letter-spacing: 2px; opacity: 0.55;
  }
  #chan span { color: #ff6b6b; }
  #clock {
    position: absolute; top: 14px; right: 16px;
    font-size: 11px; opacity: 0.5; letter-spacing: 1px;
  }
  #plaque {
    width: min(86vw, 520px);
    text-align: center;
    padding: 28px 20px;
    border: 1px solid rgba(127,255,176,0.25);
    background: rgba(127,255,176,0.03);
  }
  #year {
    font-size: 13px; letter-spacing: 4px; opacity: 0.8; margin-bottom: 10px;
  }
  #name {
    font-size: clamp(22px, 6vw, 34px);
    letter-spacing: 6px;
    margin-bottom: 16px;
    transition: text-shadow 0.3s, opacity 0.3s, filter 0.3s;
  }
  #desc {
    font-size: 13px; line-height: 1.9; letter-spacing: 1px; opacity: 0.75;
    min-height: 4.6em;
  }
  #status {
    margin-top: 22px; font-size: 12px; letter-spacing: 3px; height: 1.4em;
    transition: color 0.4s;
  }
  #noise {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    mix-blend-mode: screen; transition: opacity 0.4s;
  }
  #pads {
    position: absolute; bottom: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between;
    padding: 0 0 26px 0;
  }
  .pad {
    width: 42vw; max-width: 220px; height: 108px; margin: 0 14px;
    border: 1px dashed rgba(127,255,176,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: 3px; opacity: 0.55;
    transition: background 0.2s, opacity 0.2s, border-color 0.2s;
    touch-action: none;
  }
  .pad.active {
    background: rgba(127,255,176,0.14);
    border-color: #7fffb0;
    opacity: 1;
  }
  #hint {
    position: absolute; bottom: 140px; left: 0; width: 100%; text-align: center;
    font-size: 11px; opacity: 0.4; letter-spacing: 2px; padding: 0 10px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="chan">SUN-TV LOCAL <span>● REC</span></div>
  <div id="clock" id="clockText">--:--:--</div>

  <div id="plaque">
    <div id="year">----</div>
    <div id="name">――――</div>
    <div id="desc"></div>
    <div id="status">風化中…</div>
  </div>

  <div id="hint">ふたりの指で、同時に触れ続けてください（連弾）</div>
  <div id="pads">
    <div class="pad" id="padL">手 L</div>
    <div class="pad" id="padR">手 R</div>
  </div>

  <canvas id="noise"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
</div>

<script>
// 気象災害の一覧(Wikipedia)より抜粋・要約。文責は制作側にあり、正確な出典はWikipedia「日本の気象災害の一覧」参照。
const RECORDS = [
  { year: "1954", name: "洞爺丸台風", desc: "青函連絡船 洞爺丸が転覆。台風による海難事故として国内最大級の犠牲者を出した。" },
  { year: "1958", name: "狩野川台風", desc: "伊豆・関東を襲った記録的豪雨。狩野川流域で甚大な浸水・土砂被害が発生した。" },
  { year: "1959", name: "伊勢湾台風", desc: "高潮が名古屋南部を襲い、戦後最悪級の人的被害を出した台風災害。" },
  { year: "2018", name: "平成30年7月豪雨", desc: "西日本を中心に広域で記録的な大雨。土砂災害・浸水が同時多発した。" }
];

let idx = 0;
const yearEl = document.getElementById('year');
const nameEl = document.getElementById('name');
const descEl = document.getElementById('desc');
const statusEl = document.getElementById('status');
const clockEl = document.getElementById('clockText');
const padL = document.getElementById('padL');
const padR = document.getElementById('padR');
const noiseCanvas = document.getElementById('noise');
const nctx = noiseCanvas.getContext('2d');

function resizeNoise() {
  noiseCanvas.width = window.innerWidth;
  noiseCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeNoise);
resizeNoise();

function drawNoise() {
  const w = noiseCanvas.width, h = noiseCanvas.height;
  const imgData = nctx.createImageData(w, h);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const v = Math.random() * 255;
    imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v;
    imgData.data[i+3] = Math.random() * 40;
  }
  nctx.putImageData(imgData, 0, 0);
}

function setRecord(i) {
  const r = RECORDS[i];
  yearEl.textContent = r.year;
  nameEl.textContent = r.name;
  descEl.textContent = r.desc;
}
setRecord(idx);

// 擬似時計(実時間を表示するだけの演出。日付操作はしない)
function tickClock() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = String(d.getSeconds()).padStart(2,'0');
  clockEl.textContent = h+":"+m+":"+s;
}
setInterval(tickClock, 1000);
tickClock();

// 風化(decay)ゲージ: 0=くっきり, 1=完全に読めない
let decay = 0.15;
let heldL = false, heldR = false;

function together() { return heldL && heldR; }

function updatePads() {
  padL.classList.toggle('active', heldL);
  padR.classList.toggle('active', heldR);
}

// タッチ/ポインタ両対応
function bindPad(el, setHeld) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); setHeld(true); updatePads(); });
  el.addEventListener('pointerup', () => { setHeld(false); updatePads(); });
  el.addEventListener('pointercancel', () => { setHeld(false); updatePads(); });
  el.addEventListener('pointerleave', () => { setHeld(false); updatePads(); });
}
bindPad(padL, (v) => heldL = v);
bindPad(padR, (v) => heldR = v);

// デスクトップ確認用キーボード代替: A=左手, L=右手
window.addEventListener('keydown', (e) => {
  if (e.key === 'a' || e.key === 'A') { heldL = true; updatePads(); }
  if (e.key === 'l' || e.key === 'L') { heldR = true; updatePads(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'a' || e.key === 'A') { heldL = false; updatePads(); }
  if (e.key === 'l' || e.key === 'L') { heldR = false; updatePads(); }
});

let cycleTimer = 0;
function loop() {
  if (together()) {
    decay = Math.max(0, decay - 0.02);
    statusEl.textContent = "灯っている（連弾中）";
    statusEl.style.color = "#7fffb0";
    cycleTimer++;
    if (cycleTimer > 240) {
      cycleTimer = 0;
      idx = (idx + 1) % RECORDS.length;
      setRecord(idx);
      decay = 0.15;
    }
  } else {
    decay = Math.min(1, decay + 0.006);
    statusEl.textContent = decay > 0.85 ? "風化しきった" : "風化中…";
    statusEl.style.color = decay > 0.85 ? "#552222" : "#7fffb0aa";
  }

  const blur = decay * 6;
  const opacity = Math.max(0.08, 1 - decay * 0.9);
  const flicker = together() ? 1 : (0.85 + Math.random() * 0.15 * (1 - decay));
  nameEl.style.filter = "blur(" + blur.toFixed(2) + "px)";
  nameEl.style.opacity = (opacity * flicker).toFixed(2);
  nameEl.style.textShadow = together()
    ? "0 0 12px rgba(127,255,176,0.9)"
    : "0 0 " + (2 + decay * 2) + "px rgba(127,255,176,0.3)";
  descEl.style.opacity = Math.max(0.05, 0.75 - decay * 0.7);

  noiseCanvas.style.opacity = (decay * 0.35).toFixed(2);
  if (Math.random() < 0.3 + decay * 0.4) drawNoise();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
